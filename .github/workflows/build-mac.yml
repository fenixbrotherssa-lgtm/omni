name: Build macOS (OMNI CORE)

# Compila SOLO la app de escritorio para macOS (DMG + ZIP + omnicore-mac.yml).
# El backend no se toca aquí. Al terminar, en "Artifacts" del run queda un zip
# con los archivos LISTOS para mover tal cual a la carpeta de descargas del
# sitio (public/downloads/ — o C:\Program Files\CasRodsoft Web\public\downloads\
# en el servidor). No hay que renombrar ni editar nada.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Convertir icono.png → icono.icns (si no existe .icns)
        working-directory: assets
        run: |
          if [ ! -f icono.icns ]; then
            if [ -f icono.png ]; then
              mkdir -p icono.iconset
              sips -z 16   16   icono.png --out icono.iconset/icon_16x16.png
              sips -z 32   32   icono.png --out icono.iconset/icon_16x16@2x.png
              sips -z 32   32   icono.png --out icono.iconset/icon_32x32.png
              sips -z 64   64   icono.png --out icono.iconset/icon_32x32@2x.png
              sips -z 128  128  icono.png --out icono.iconset/icon_128x128.png
              sips -z 256  256  icono.png --out icono.iconset/icon_128x128@2x.png
              sips -z 256  256  icono.png --out icono.iconset/icon_256x256.png
              sips -z 512  512  icono.png --out icono.iconset/icon_256x256@2x.png
              sips -z 512  512  icono.png --out icono.iconset/icon_512x512.png
              sips -z 1024 1024 icono.png --out icono.iconset/icon_512x512@2x.png
              iconutil -c icns icono.iconset -o icono.icns
              rm -rf icono.iconset
              echo "icono.icns generado desde icono.png"
            else
              echo "AVISO: no hay icono.png ni icono.icns — se usa el ícono por defecto de Electron."
              sed -i '' '/"icon": "assets\/icono.icns"/d' ../package.json
            fi
          else
            echo "icono.icns ya existe."
          fi

      - name: Ofuscar + empaquetar (DMG universal + ZIP + omnicore-mac.yml)
        env:
          TARGET_PLATFORM: darwin
        run: node build.js

      - name: Reunir artefactos para descargas
        run: |
          mkdir -p publish
          cp dist/OMNI-CORE-*-mac.dmg          publish/ 2>/dev/null || true
          cp dist/OMNI-CORE-*-mac.dmg.blockmap publish/ 2>/dev/null || true
          cp dist/OMNI-CORE-*-mac.zip          publish/ 2>/dev/null || true
          cp dist/OMNI-CORE-*-mac.zip.blockmap publish/ 2>/dev/null || true
          cp dist/omnicore-mac.yml             publish/ 2>/dev/null || true
          ls -la publish

      - name: Subir artefactos (mover tal cual a public/downloads/)
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-CORE-mac-downloads
          path: publish/*
          if-no-files-found: error
