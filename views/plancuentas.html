<div class="omni-mod">
    <div class="omni-head">
        <div class="omni-head-l">
            <button class="omni-btn omni-btn-ghost" onclick="App.renderView('dashboard','viewport')"><i class="fas fa-chevron-left"></i></button>
            <div>
                <h2><i class="fas fa-sitemap"></i> PLAN DE CUENTAS</h2>
                <p class="omni-sub">Catálogo contable configurable · Activo · Pasivo · Patrimonio · Ingresos · Gastos</p>
            </div>
        </div>
        <div class="omni-head-r">
            <button class="omni-btn omni-btn-primary admin-only" onclick="PlancuentasModule.abrirModal()"><i class="fas fa-plus"></i> NUEVA CUENTA</button>
        </div>
    </div>

    <div class="omni-toolbar">
        <input type="text" id="pc-buscar" class="omni-input" placeholder="Buscar por código o nombre...">
        <select id="pc-tipo" class="omni-input">
            <option value="TODOS">Todos los tipos</option>
            <option value="ACTIVO">Activo</option>
            <option value="PASIVO">Pasivo</option>
            <option value="PATRIMONIO">Patrimonio</option>
            <option value="INGRESO">Ingreso</option>
            <option value="GASTO">Gasto</option>
            <option value="ORDEN">Orden</option>
        </select>
        <label class="omni-check"><input type="checkbox" id="pc-inactivas"> Ver inactivas</label>
        <span class="omni-count" id="pc-count">0 cuentas</span>
    </div>

    <div class="omni-tablewrap">
        <table class="omni-table">
            <thead><tr>
                <th style="width:130px">Código</th><th>Nombre</th>
                <th style="width:110px">Tipo</th><th style="width:110px">Naturaleza</th>
                <th style="width:90px">Movim.</th><th style="width:80px">Mov.</th>
                <th style="width:90px">Estado</th><th style="width:120px" class="admin-only">Acción</th>
            </tr></thead>
            <tbody id="pc-body"><tr><td colspan="8" class="omni-empty">Cargando...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="pc-modal" class="omni-modal-bg" style="display:none;">
    <div class="omni-modal">
        <h3 id="pc-modal-title">Nueva cuenta</h3>
        <input type="hidden" id="pc-f-id">
        <div class="omni-form-grid">
            <label>Código <input type="text" id="pc-f-codigo" class="omni-input" placeholder="Ej: 1.1.15"></label>
            <label>Nombre <input type="text" id="pc-f-nombre" class="omni-input" placeholder="Nombre de la cuenta"></label>
            <label>Tipo
                <select id="pc-f-tipo" class="omni-input">
                    <option value="ACTIVO">Activo</option><option value="PASIVO">Pasivo</option>
                    <option value="PATRIMONIO">Patrimonio</option><option value="INGRESO">Ingreso</option>
                    <option value="GASTO">Gasto</option><option value="ORDEN">Orden</option>
                </select>
            </label>
            <label>Naturaleza
                <select id="pc-f-nat" class="omni-input"><option value="DEUDORA">Deudora</option><option value="ACREEDORA">Acreedora</option></select>
            </label>
            <label class="omni-check" style="grid-column:1/-1"><input type="checkbox" id="pc-f-mov" checked> Es cuenta de movimiento (imputable en asientos)</label>
            <label class="omni-check" id="pc-f-estado-wrap" style="grid-column:1/-1;display:none;"><input type="checkbox" id="pc-f-estado" checked> Cuenta activa</label>
        </div>
        <div class="omni-modal-actions">
            <button class="omni-btn omni-btn-ghost" onclick="PlancuentasModule.cerrarModal()">Cancelar</button>
            <button class="omni-btn omni-btn-primary" onclick="PlancuentasModule.guardar()"><i class="fas fa-save"></i> Guardar</button>
        </div>
    </div>
</div>
