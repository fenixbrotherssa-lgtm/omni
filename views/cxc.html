<div class="omni-mod">
    <div class="omni-head">
        <div class="omni-head-l">
            <button class="omni-btn omni-btn-ghost" onclick="App.renderView('dashboard','viewport')"><i class="fas fa-chevron-left"></i></button>
            <div>
                <h2><i class="fas fa-hand-holding-dollar"></i> CUENTAS POR COBRAR</h2>
                <p class="omni-sub">Cartera de clientes · antigüedad de saldos · cobros con asiento automático</p>
            </div>
        </div>
        <div class="omni-head-r">
            <button class="omni-btn omni-btn-primary" onclick="CxcModule.abrirNueva()"><i class="fas fa-plus"></i> NUEVA CxC</button>
        </div>
    </div>

    <div class="omni-cards" id="cxc-cards"></div>

    <div class="omni-toolbar">
        <select id="cxc-estado" class="omni-input" onchange="CxcModule.cargar()">
            <option value="">Pendientes y parciales</option>
            <option value="PENDIENTE">Solo pendientes</option>
            <option value="PARCIAL">Solo parciales</option>
            <option value="PAGADA">Pagadas</option>
            <option value="ANULADA">Anuladas</option>
        </select>
        <input type="text" id="cxc-buscar" class="omni-input" placeholder="Filtrar por cliente..." oninput="CxcModule.render()">
        <span class="omni-count" id="cxc-count"></span>
    </div>

    <div class="omni-tablewrap">
        <table class="omni-table">
            <thead><tr>
                <th>Cliente</th><th style="width:110px">Documento</th>
                <th style="width:100px">Emisión</th><th style="width:100px">Vence</th><th style="width:70px">Días</th>
                <th style="width:120px" class="num">Monto</th><th style="width:120px" class="num">Saldo</th>
                <th style="width:100px">Estado</th><th style="width:170px">Acción</th>
            </tr></thead>
            <tbody id="cxc-body"><tr><td colspan="9" class="omni-empty">Cargando...</td></tr></tbody>
        </table>
    </div>
</div>

<div id="cxc-modal" class="omni-modal-bg" style="display:none;">
    <div class="omni-modal">
        <h3 id="cxc-modal-title">Nueva cuenta por cobrar</h3>
        <div id="cxc-modal-body"></div>
        <div class="omni-modal-actions">
            <button class="omni-btn omni-btn-ghost" onclick="CxcModule.cerrar()">Cancelar</button>
            <button class="omni-btn omni-btn-primary" id="cxc-modal-ok"><i class="fas fa-save"></i> Guardar</button>
        </div>
    </div>
</div>
