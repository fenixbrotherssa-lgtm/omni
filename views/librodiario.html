<div class="omni-mod">
    <div class="omni-head">
        <div class="omni-head-l">
            <button class="omni-btn omni-btn-ghost" onclick="App.renderView('dashboard','viewport')"><i class="fas fa-chevron-left"></i></button>
            <div>
                <h2><i class="fas fa-book-open"></i> LIBRO DIARIO</h2>
                <p class="omni-sub">Asientos contables · registro cronológico de la partida doble</p>
            </div>
        </div>
        <div class="omni-head-r">
            <button class="omni-btn omni-btn-primary" onclick="LibrodiarioModule.abrirAsiento()"><i class="fas fa-plus"></i> NUEVO ASIENTO</button>
        </div>
    </div>

    <div class="omni-toolbar">
        <label class="omni-fld">Desde <input type="date" id="ld-desde" class="omni-input"></label>
        <label class="omni-fld">Hasta <input type="date" id="ld-hasta" class="omni-input"></label>
        <select id="ld-origen" class="omni-input">
            <option value="">Todos los orígenes</option>
            <option value="MANUAL">Manual</option><option value="FACTURA">Factura</option>
            <option value="COMPRA">Compra</option><option value="NC">Nota de crédito</option>
            <option value="ND">Nota de débito</option><option value="RETENCION">Retención</option>
            <option value="NOMINA">Nómina</option><option value="CAJA">Caja</option>
        </select>
        <button class="omni-btn omni-btn-ghost" onclick="LibrodiarioModule.cargar()"><i class="fas fa-magnifying-glass"></i> Consultar</button>
        <span class="omni-count" id="ld-tot"></span>
    </div>

    <div id="ld-list" class="omni-diario"><div class="omni-empty">Selecciona un rango y consulta.</div></div>
</div>

<!-- Modal detalle -->
<div id="ld-det-modal" class="omni-modal-bg" style="display:none;">
    <div class="omni-modal" style="width:min(680px,94vw)">
        <h3 id="ld-det-title">Asiento</h3>
        <div id="ld-det-body"></div>
        <div class="omni-modal-actions">
            <button class="omni-btn omni-btn-danger admin-only" id="ld-det-anular"><i class="fas fa-ban"></i> Anular</button>
            <button class="omni-btn omni-btn-ghost" onclick="LibrodiarioModule.cerrarDet()">Cerrar</button>
        </div>
    </div>
</div>

<!-- Modal nuevo asiento -->
<div id="ld-modal" class="omni-modal-bg" style="display:none;">
    <div class="omni-modal" style="width:min(880px,96vw)">
        <h3>Nuevo asiento manual</h3>
        <div class="omni-form-grid" style="grid-template-columns:repeat(3,1fr)">
            <label>Fecha <input type="date" id="as-fecha" class="omni-input"></label>
            <label>Tipo
                <select id="as-tipo" class="omni-input">
                    <option value="MANUAL">Manual</option><option value="AJUSTE">Ajuste</option>
                    <option value="APERTURA">Apertura</option><option value="CIERRE">Cierre</option>
                    <option value="CAJA">Caja</option><option value="NOMINA">Nómina</option>
                </select>
            </label>
            <label>Referencia <input type="text" id="as-ref" class="omni-input" placeholder="Nro documento"></label>
            <label>Centro de costo <select id="as-centro" class="omni-input"><option value="">— ninguno —</option></select></label>
            <label>Proyecto <select id="as-proyecto" class="omni-input"><option value="">— ninguno —</option></select></label>
            <label style="grid-column:1/-1">Glosa <input type="text" id="as-glosa" class="omni-input" placeholder="Descripción del asiento"></label>
        </div>

        <table class="omni-table omni-lineas">
            <thead><tr><th>Cuenta</th><th style="width:140px">Debe</th><th style="width:140px">Haber</th><th style="width:44px"></th></tr></thead>
            <tbody id="as-lineas"></tbody>
            <tfoot><tr>
                <td style="text-align:right;font-weight:900">TOTALES</td>
                <td id="as-td" style="font-weight:900">0.00</td>
                <td id="as-th" style="font-weight:900">0.00</td>
                <td></td>
            </tr><tr>
                <td style="text-align:right" colspan="1"><span id="as-cuadre" class="badge b-off">Descuadrado</span></td>
                <td colspan="3"><button class="omni-btn omni-btn-ghost" style="padding:6px 12px" onclick="LibrodiarioModule.addLinea()"><i class="fas fa-plus"></i> Agregar línea</button></td>
            </tr></tfoot>
        </table>

        <div class="omni-modal-actions">
            <button class="omni-btn omni-btn-ghost" onclick="LibrodiarioModule.cerrarAsiento()">Cancelar</button>
            <button class="omni-btn omni-btn-primary" id="as-guardar" onclick="LibrodiarioModule.guardarAsiento()"><i class="fas fa-save"></i> Registrar asiento</button>
        </div>
    </div>
</div>
