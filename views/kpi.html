<div class="omni-mod">
    <div class="omni-head">
        <div class="omni-head-l">
            <button class="omni-btn omni-btn-ghost" onclick="App.renderView('dashboard','viewport')"><i class="fas fa-chevron-left"></i></button>
            <div>
                <h2><i class="fas fa-chart-column"></i> TABLERO KPI · 5D</h2>
                <p class="omni-sub">Ventas por día · ítem · cliente · forma de pago · día de la semana</p>
            </div>
        </div>
        <div class="omni-head-r" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="date" id="fechaInicioKPI" class="omni-input" style="width:150px">
            <input type="date" id="fechaFinKPI" class="omni-input" style="width:150px">
            <div id="sedeSelectorKPI"></div>
            <button class="omni-btn omni-btn-primary" onclick="KpiModule.cargarMetricas()"><i class="fas fa-rotate"></i> Actualizar</button>
            <button class="omni-btn" onclick="KpiModule.exportarPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="omni-btn" onclick="KpiModule.exportarCSV()"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
    </div>

    <div id="kpi-cards" class="kpi-cards"></div>

    <div class="kpi-grid">
        <div class="kpi-box">
            <h4>Curva de ingresos</h4>
            <div id="kpi-curva" class="kpi-bars"></div>
        </div>
        <div class="kpi-box">
            <h4>Recurrente</h4>
            <div id="kpi-recurrente" class="kpi-mini"></div>
        </div>
    </div>

    <div class="kpi-grid4">
        <div class="kpi-box"><h4>Top ítems <button class="kpi-more" onclick="KpiModule.detalle('item')">detalle</button></h4><div id="kpi-items"></div></div>
        <div class="kpi-box"><h4>Top clientes <button class="kpi-more" onclick="KpiModule.detalle('cliente')">detalle</button></h4><div id="kpi-clientes"></div></div>
        <div class="kpi-box"><h4>Forma de pago <button class="kpi-more" onclick="KpiModule.detalle('formapago')">detalle</button></h4><div id="kpi-pago"></div></div>
        <div class="kpi-box"><h4>Día de la semana <button class="kpi-more" onclick="KpiModule.detalle('diasemana')">detalle</button></h4><div id="kpi-dsem"></div></div>
    </div>
</div>

<style>
