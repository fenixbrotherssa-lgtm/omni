<div class="omni-mod">
    <div class="omni-head">
        <div class="omni-head-l">
            <button class="omni-btn omni-btn-ghost" onclick="App.renderView('dashboard','viewport')"><i class="fas fa-chevron-left"></i></button>
            <div>
                <h2><i class="fas fa-database"></i> RESPALDOS</h2>
                <p class="omni-sub">Copias de seguridad de la base de datos y los archivos</p>
            </div>
        </div>
        <div class="omni-head-r">
            <button class="omni-btn omni-btn-primary" id="rb-run" onclick="RespaldosModule.ejecutar()"><i class="fas fa-play"></i> Respaldar ahora</button>
        </div>
    </div>

    <div class="omni-toolbar">
        <span class="omni-sub" id="rb-carpeta">—</span>
        <button class="omni-btn omni-btn-ghost" onclick="RespaldosModule.cargar()"><i class="fas fa-rotate"></i> Actualizar</button>
        <span class="omni-count" id="rb-count">0</span>
    </div>

    <div class="omni-tablewrap">
        <table class="omni-table">
            <thead><tr><th>Archivo</th><th style="width:120px">Tamaño</th><th style="width:200px">Fecha</th><th style="width:120px">Acción</th></tr></thead>
            <tbody id="rb-body"><tr><td colspan="4" class="omni-empty">Cargando…</td></tr></tbody>
        </table>
    </div>

    <p class="omni-sub" style="margin-top:14px">
        <i class="fas fa-circle-info"></i> El respaldo automático corre según <code>BACKUP_CRON</code> (por defecto 02:00). Para enviarlo a Google Drive, configura <code>BACKUP_RCLONE_REMOTE</code> con un remoto de <code>rclone</code>.
    </p>
</div>
